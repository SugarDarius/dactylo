packages:
  - packages/*
  - apps/*
  - playgrounds/*
allowBuilds:
  esbuild: true
  sharp: true
autoInstallPeers: true
catalog:
  '@arethetypeswrong/core': ^0.18.5
  '@types/node': ^26.6.6
  happy-dom: ^21.0.4
  oxfmt: ^0.78.0
  oxlint: ^1.91.0
  publint: ^0.3.25
  syncpack: ^15.3.3
  tsdown: ^0.23.1
  turbo: ^2.11.11
  typescript: ^7.0.2
  ultracite: ^8.2.0
  vitest: ^5.0.5
catalogs:
  react19:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: ^19.3.0
    react-dom: ^19.3.0
cleanupUnusedCatalogs: true
engineStrict: true
permissions:
  tsdown:
    skills: true
  ultracite:
    skills: true
skills:
  dirs:
    - .cursor/skills
